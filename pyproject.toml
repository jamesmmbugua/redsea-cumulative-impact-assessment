[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rscia"
version = "0.1.0"
description = "Cumulative impact assessment for the Saudi Red Sea EEZ"
requires-python = ">=3.10"
dependencies = [
  "numpy", "pandas", "scipy", "pyyaml", "matplotlib",
  "rasterio>=1.3", "geopandas>=1.0", "shapely>=2.0", "pyproj",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
rscia = "rscia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
