project:
  name: Red Sea Cumulative Impact Assessment
  short_name: rscia
  version: 0.1.0

grid:
  # Albers Equal Area centred on the Saudi Red Sea
  crs: "+proj=aea +lat_0=22 +lon_0=39 +lat_1=18.5 +lat_2=27.5 +x_0=0 +y_0=0 +datum=WGS84 +units=m +no_defs"
  resolution_m: 1000
  eez_file: data/raw/boundaries/eez_v12.gpkg
  # Filter applied to the EEZ file to select the Saudi Red Sea part.
  # Check field names and values in the downloaded file.
  eez_filter:
    field: GEONAME
    values: ["Saudi Arabian Exclusive Economic Zone (Red Sea)"]
  # Optional: polygon to keep only the Red Sea side (used if the EEZ file has one Saudi polygon)
  clip_file: null
  coastline_file: data/raw/boundaries/land_polygons.gpkg
  coastal_buffer_m: 2000
  template_raster: data/processed/grid/template.tif

normalization:
  reference_percentile: 99
  # Scenario layers use the baseline reference value so increases stay visible
  scenario_uses_baseline_reference: true
  clip_max: 1.0
  # null lets new pressure above today's maximum show in full in scenarios
  scenario_clip_max: null

paths:
  components_dir: data/processed/components
  pressures_dir: data/processed/pressures
  scenarios_dir: data/processed/scenarios
  surveys_file: data/surveys/coral_surveys.csv
  planning_units_file: null   # optional polygons for summary tables
  planning_units_field: name
  outputs_dir: outputs

model:
  sensitivity_matrix: config/sensitivity_matrix.csv
  sensitivity_confidence: config/sensitivity_confidence.csv
  hotspot_percentile: 90
