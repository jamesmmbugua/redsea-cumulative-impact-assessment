project:
  name: Red Sea Cumulative Impact Assessment
  short_name: rscia
  version: 0.1.0

grid:
  # Albers Equal Area centred on the Saudi Red Sea
  crs: "+proj=aea +lat_0=22 +lon_0=39 +lat_1=18.5 +lat_2=27.5 +x_0=0 +y_0=0 +datum=WGS84 +units=m +no_defs"
  resolution_m: 1000
  eez_file: data/interim/reference/boundaries/eez_v12.gpkg
  # scripts/download_eez.py writes the Saudi Red Sea part only, so no filter is needed.
  # If you use another EEZ file, select the Saudi Red Sea feature here, e.g.
  # eez_filter: {field: GEONAME, values: ["..."]}
  eez_filter: null
  # Optional: polygon to keep only the Red Sea side (used if the EEZ file has one Saudi polygon)
  clip_file: null
  coastline_file: data/interim/reference/boundaries/land_polygons.gpkg
  coastal_buffer_m: 2000
  template_raster: data/processed/grid/template.tif

normalization:
  reference_percentile: 99
  # Scenario layers use the baseline reference value so increases stay visible
  scenario_uses_baseline_reference: true
  clip_max: 1.0
  # null lets new pressure above today's maximum show in full in scenarios
  scenario_clip_max: null

paths:
  # Three data stages, each with the same thematic folders (see docs/data_management.md):
  #   raw      original files exactly as received, one folder per source, never edited
  #   interim  cleaned model inputs: clipped, reprojected, standard attribute names
  #   processed model-ready 1 km rasters written by rscia
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  # Rasters are read and written as <dir>/<theme>/<id>.tif
  components_dir: data/processed/components
  pressures_dir: data/processed/pressures
  scenarios_dir: data/processed/scenarios
  surveys_file: data/interim/reference/surveys/coral_surveys.csv
  planning_units_file: null   # optional polygons for summary tables
  planning_units_field: name
  outputs_dir: outputs

themes:
  # Thematic groups. Each component's `group` and each pressure's `theme` must be listed here.
  # The code is the folder name at every data stage; the label is used in reports and exports.
  reference:
    boundaries: Boundaries and regions
    bathymetry: Bathymetry
    bio_oracle: Bio-ORACLE environmental layers
    surveys: Coral reef surveys
  components:
    benthic_habitats: Benthic habitats
    marine_turtles: Marine turtles
    marine_mammals: Marine mammals
    sharks_rays: Sharks and rays
    seabirds: Seabirds
    fish: Fish
    pelagic: Pelagic
  pressures:
    coastal_development: Coastal development
    discharges: Discharges
    maritime_transport: Maritime transport
    fisheries_aquaculture: Fisheries and aquaculture
    tourism: Tourism
    climate: Climate

regions:
  # Three assessment regions based on the MEOW ecoregions (Spalding et al. 2007):
  # "Northern and Central Red Sea" is split at split_latitude into Northern and Central;
  # "Southern Red Sea" is the Southern region. Built by scripts/build_regions.py.
  file: data/interim/reference/boundaries/regions.gpkg
  field: region
  meow_file: data/raw/reference/boundaries/meow/meow_ecos.shp
  # Latitude (degrees N) where MEOW "Northern and Central Red Sea" is split into
  # Northern (north of the line) and Central (south of it). TO BE CONFIRMED.
  north_central_split_latitude: null
  raster: data/processed/grid/regions.tif
  # Region id 0 (cells not covered by the polygons) uses the default matrix.
  list:
    - {id: 1, code: northern, name: Northern Red Sea}
    - {id: 2, code: central, name: Central Red Sea}
    - {id: 3, code: southern, name: Southern Red Sea}

model:
  # Default matrix, used for any region without its own matrix below
  sensitivity_matrix: config/sensitivity_matrix.csv
  sensitivity_confidence: config/sensitivity_confidence.csv
  # One matrix per region. Until the expert workshop scores each region separately,
  # all three point to the same draft matrix.
  regional_matrices:
    northern: {matrix: config/sensitivity_matrix.csv, confidence: config/sensitivity_confidence.csv}
    central: {matrix: config/sensitivity_matrix.csv, confidence: config/sensitivity_confidence.csv}
    southern: {matrix: config/sensitivity_matrix.csv, confidence: config/sensitivity_confidence.csv}
  hotspot_percentile: 90
  # Results are also given on a 0 to 100 scale: 100 = this percentile of baseline impact
  result_normalization_percentile: 95
  # Rarity-adjusted impact: each component's impact is divided by the share of the
  # study area it occupies, so rare components weigh more. Components below this
  # share are left out of the rarity-adjusted layer to avoid extreme values.
  rarity_min_share: 0.0005
  # Components reported first in screening reports (coral, turtle and related mandates)
  focal_components: [coral_shallow, coral_mesophotic, seagrass, mangrove, turtle_nesting,
                     green_turtle, hawksbill_turtle, dugong]
